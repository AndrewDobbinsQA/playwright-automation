name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Toolshop
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          ref: ae7caecb811dd8952c09d997e69be7cb946ecd44
          path: toolshop

      - name: Configure Toolshop environment
        run: echo "SPRINT=sprint5" > toolshop/.env

      - name: Start Toolshop database and PHP API
        working-directory: toolshop
        run: |
          docker compose up -d --build mariadb laravel-api

      - name: Install Toolshop PHP dependencies
        working-directory: toolshop
        run: docker compose run --rm composer

      - name: Fix Laravel directory permissions
        working-directory: toolshop
        run: |
          docker compose exec -T -u root laravel-api sh -c \
            'chown -R 1000:82 storage bootstrap/cache'

          docker compose exec -T laravel-api sh -c \
            'test -w storage/logs && test -w storage/framework/views && test -w bootstrap/cache && echo "Laravel directories are writable"'

      - name: Wait for Toolshop database
        working-directory: toolshop
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T mariadb mariadb-admin ping --silent; then
              echo "MariaDB is responding"
              exit 0
            fi
            echo "Waiting for MariaDB..."
            sleep 2
          done
          echo "MariaDB did not become ready"
          exit 1

      - name: Prepare Toolshop database
        working-directory: toolshop
        run: |
          docker compose exec -T laravel-api php artisan migrate --force
          docker compose exec -T laravel-api php artisan db:seed --force

      - name: Start Toolshop frontend and web server
        working-directory: toolshop
        run: |
          docker compose up -d --build phpmyadmin web angular-ui

      - name: Wait for Toolshop application
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null http://localhost:4200/ && \
               curl --fail --silent --output /dev/null http://localhost:8091/products; then
              echo "Toolshop frontend and API are ready"
              exit 0
            fi
            echo "Waiting for Toolshop application... ($attempt/60)"
            sleep 2
          done
          echo "Toolshop did not become ready"
          echo "Frontend HTTP response:"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:4200/ || true

          echo "API HTTP response:"
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" http://localhost:8091/products || true

          echo "Nginx container logs:"
          docker compose -f toolshop/docker-compose.yml -f toolshop/docker-compose.override.yml logs --tail=50 web

          echo "Angular container logs:"
          docker compose -f toolshop/docker-compose.yml -f toolshop/docker-compose.override.yml logs --tail=50 angular-ui

          echo "Laravel container logs:"
          docker compose -f toolshop/docker-compose.yml -f toolshop/docker-compose.override.yml logs --tail=50 laravel-api

          echo "Laravel application logs:"
          docker compose -f toolshop/docker-compose.yml -f toolshop/docker-compose.override.yml exec -T laravel-api sh -c 'for file in storage/logs/*.log; do if [ -f "$file" ]; then echo "Log: $file"; tail -n 80 "$file"; fi; done'
          docker compose -f toolshop/docker-compose.yml -f toolshop/docker-compose.override.yml ps
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run Playwright tests
        run: npx playwright test
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
